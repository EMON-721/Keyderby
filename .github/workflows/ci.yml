name: Verify Keyderby
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm build
      - run: pnpm cloudflare:config
      - name: Verify generated Cloudflare D1 binding
        run: node -e "const c=require('./dist/server/wrangler.cloudflare.json'); const d=c.d1_databases?.find(x=>x.binding==='DB'); if(!d||!d.database_id||d.database_name!=='keyderby'||c.name!=='keyderby') process.exit(1); console.log('PASS Cloudflare D1 binding DB ->',d.database_name);"
      - run: pnpm test:integration
      - run: pnpm audit --prod
      - run: pnpm security:scan
